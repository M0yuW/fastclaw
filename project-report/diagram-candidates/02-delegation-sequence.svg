<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#183047} .title{font-size:32px;font-weight:700;letter-spacing:-.3px} .subtitle{font-size:17px;fill:#52677a} .label{font-size:21px;font-weight:700} .body{font-size:16px;fill:#52677a} .micro{font-size:14px;fill:#52677a} .smallhead{font-size:16px;font-weight:700} .phase{font-size:15px;font-weight:700;letter-spacing:1.2px;fill:#386895}</style>
<text x="65" y="71" class="title" text-anchor="start">Correlated delegation and bounded execution</text>
<text x="65" y="104" class="subtitle" text-anchor="start">A single root task delegates parallel specialist work without taking another root slot</text>
