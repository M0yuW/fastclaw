<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastClaw Stage 2 Freeze Audit</title>
  <style>
    :root {
      --ink: #17211c;
      --muted: #667069;
      --paper: #f5f2e9;
      --panel: #fffdf7;
      --line: #d8d5ca;
      --green: #175c45;
      --green-soft: #e5f1eb;
      --orange: #a44b20;
      --orange-soft: #f8e9df;
      --slate: #52615a;
      --shadow: 0 12px 35px rgba(31, 45, 38, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 28px; background: rgba(245, 242, 233, .96); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto; border-radius: 12px; color: #fff; background: var(--green); font-weight: 800; letter-spacing: -.04em; }
    h1 { margin: 0; font: 700 18px/1.2 Georgia, "Times New Roman", serif; }
    .subtitle { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .local-badge { padding: 6px 10px; border: 1px solid #bad1c5; border-radius: 999px; color: var(--green); background: var(--green-soft); font-size: 12px; font-weight: 700; }
    select, .secondary { padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--panel); }
    .export { padding: 10px 14px; border: 0; border-radius: 9px; color: #fff; background: var(--green); font-weight: 700; }
    .shell { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: calc(100vh - 75px); }
    aside { position: sticky; top: 75px; height: calc(100vh - 75px); overflow: auto; border-right: 1px solid var(--line); background: #efede4; }
    .summary { padding: 20px; border-bottom: 1px solid var(--line); }
    .summary-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
    .summary strong { font-size: 20px; }
    .progress { height: 7px; overflow: hidden; border-radius: 99px; background: #d9d8d0; }
    .progress > div { height: 100%; width: 0; background: var(--green); transition: width .2s ease; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat { padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.45); }
    .stat b { display: block; font-size: 17px; }
    .stat span { color: var(--muted); font-size: 11px; }
    .tools { padding: 14px; border-bottom: 1px solid var(--line); }
    .search { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .filters { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .filter { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: transparent; font-size: 12px; }
    .filter.active { color: #fff; border-color: var(--green); background: var(--green); }
    .task-list { padding: 8px; }
    .task { width: 100%; padding: 11px 12px; border: 1px solid transparent; border-radius: 9px; text-align: left; color: inherit; background: transparent; }
    .task:hover { background: rgba(255,255,255,.5); }
    .task.active { border-color: #b5c7bd; background: var(--panel); box-shadow: 0 3px 12px rgba(31,45,38,.05); }
    .task-top { display: flex; gap: 8px; align-items: center; }
    .dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: #bbbdb7; }
    .dot.pass { background: var(--green); }
    .dot.issue { background: var(--orange); }
    .task-id { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .task-type { margin: 3px 0 0 16px; color: var(--muted); font-size: 11px; }
    main { padding: 34px clamp(24px, 5vw, 72px) 60px; overflow: hidden; }
    .content { max-width: 940px; margin: 0 auto; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h2 { margin: 7px 0 4px; font: 700 clamp(25px, 3vw, 34px)/1.2 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
    .notice { display: flex; gap: 10px; margin: 22px 0; padding: 13px 15px; border: 1px solid #e3c9b9; border-radius: 10px; color: #713a20; background: var(--orange-soft); }
    .card { margin: 16px 0; padding: 20px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 12px; font-size: 14px; }
    .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
    .meta-item span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .meta-item div, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
    a { color: var(--green); }
    blockquote { margin: 0; padding: 14px 16px; border-left: 3px solid var(--green); background: var(--green-soft); white-space: pre-wrap; }
    pre { margin: 0; padding: 14px; overflow: auto; border-radius: 9px; background: #eff0eb; white-space: pre-wrap; overflow-wrap: anywhere; }
    .record { margin-top: 10px; padding: 13px; border: 1px solid var(--line); border-radius: 9px; }
    .record strong { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .record p { margin: 7px 0 0; color: #3f4943; }
    .form-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .saved { color: var(--muted); font-size: 12px; }
    .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 12px 0 18px; }
    .verdict { padding: 11px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fff; font-weight: 700; }
    .verdict[data-value="PASS"].selected { color: #fff; border-color: var(--green); background: var(--green); }
    .verdict:not([data-value="PASS"]).selected { color: #fff; border-color: var(--orange); background: var(--orange); }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    label small { color: var(--muted); font-weight: 400; }
    textarea { width: 100%; min-height: 115px; padding: 12px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    textarea:focus, input:focus, select:focus { outline: 2px solid #96b9a8; outline-offset: 1px; }
    .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .nav-group { display: flex; gap: 8px; }
    .danger { color: #8f3219; }
    .empty { padding: 40px 14px; color: var(--muted); text-align: center; }
    .footer-tools { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 22px; color: var(--muted); font-size: 12px; }
    .file-input { display: none; }
    @media (max-width: 800px) {
      .topbar { position: static; padding: 14px; flex-wrap: wrap; }
      .local-badge { display: none; }
      .shell { display: block; }
      aside { position: static; width: 100%; height: auto; max-height: 340px; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 24px 15px 50px; }
      .meta, .verdicts { grid-template-columns: 1fr; }
      .top-actions { width: 100%; }
      .top-actions select { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">F2</div>
      <div><h1>Stage 2 Freeze Audit</h1><div class="subtitle">Independent source and oracle review</div></div>
    </div>
    <div class="top-actions">
      <span class="local-badge">Local-only · no upload</span>
      <select id="reviewer" aria-label="Reviewer"><option value="a">Reviewer A</option><option value="b">Reviewer B</option></select>
      <button class="export" id="export">Export CSV</button>
    </div>
  </header>
  <div class="shell">
    <aside>
      <div class="summary">
        <div class="summary-row"><span>Completion</span><strong id="completion">0 / 98</strong></div>
        <div class="progress"><div id="progress"></div></div>
        <div class="stats"><div class="stat"><b id="pass-count">0</b><span>Pass</span></div><div class="stat"><b id="issue-count">0</b><span>Issues</span></div><div class="stat"><b id="pending-count">98</b><span>Pending</span></div></div>
      </div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="Search task ID or source…">
        <div class="filters" id="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="pending">Pending</button>
          <button class="filter" data-filter="pass">Pass</button>
          <button class="filter" data-filter="issues">Issues</button>
          <button class="filter" data-filter="source">Sources</button>
          <button class="filter" data-filter="oracle_calculation">Calculations</button>
          <button class="filter" data-filter="evidence_equivalence_group">Groups</button>
        </div>
      </div>
      <div class="task-list" id="task-list"></div>
    </aside>
    <main><div class="content" id="content"></div></main>
  </div>
  <input class="file-input" id="import-file" type="file" accept=".csv,text/csv">
  <script>
    const TASKS = __STAGE2_REVIEW_TASKS__;
    const FIELDS = ["audit_id","audit_type","item_id","source_id","locator","filing_date","accepted_at","accession","url","source_sha256","claimed_excerpt","input_facts","calculation_spec","record_previews","review_task","review_guidance","verdict","independent_result","notes"];
    const $ = id => document.getElementById(id);
    let reviewer = localStorage.getItem("fastclaw-stage2-reviewer") || "a";
    let responses = loadResponses(reviewer);
    let selected = 0;
    let filter = "all";
    let query = "";

    function key(which) { return `fastclaw-stage2-review-${which}`; }
    function loadResponses(which) {
      try { return JSON.parse(localStorage.getItem(key(which))) || {}; }
      catch (_) { return {}; }
    }
    function saveResponses() {
      localStorage.setItem(key(reviewer), JSON.stringify(responses));
      const saved = $("saved");
      if (saved) saved.textContent = `Saved locally · ${new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}`;
      renderStats(); renderList();
    }
    function response(task) { return responses[task.audit_id] || {verdict: "", independent_result: "", notes: ""}; }
    function complete(task) { const r = response(task); return Boolean(r.verdict && r.independent_result.trim()); }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch])); }
    function prettyType(type) { return ({source:"Source fact",oracle_calculation:"Oracle calculation",evidence_equivalence_group:"Evidence group"})[type] || type; }
    function parseJson(value, fallback) { try { return JSON.parse(value); } catch (_) { return fallback; } }
    function visibleTasks() {
      return TASKS.filter(task => {
        const r = response(task);
        const haystack = `${task.audit_id} ${task.item_id} ${task.source_id} ${task.review_task}`.toLowerCase();
        const searchOk = !query || haystack.includes(query.toLowerCase());
        const filterOk = filter === "all" || (filter === "pending" && !complete(task)) || (filter === "pass" && r.verdict === "PASS") || (filter === "issues" && r.verdict && r.verdict !== "PASS") || task.audit_type === filter;
        return searchOk && filterOk;
      });
    }
    function renderStats() {
      const done = TASKS.filter(complete).length;
      const pass = TASKS.filter(t => response(t).verdict === "PASS").length;
      const issues = TASKS.filter(t => response(t).verdict && response(t).verdict !== "PASS").length;
      $("completion").textContent = `${done} / ${TASKS.length}`;
      $("progress").style.width = `${done / TASKS.length * 100}%`;
      $("pass-count").textContent = pass;
      $("issue-count").textContent = issues;
      $("pending-count").textContent = TASKS.length - done;
    }
    function renderList() {
      const list = visibleTasks();
      $("task-list").innerHTML = list.length ? list.map(task => {
        const index = TASKS.indexOf(task); const r = response(task);
        const state = r.verdict === "PASS" ? "pass" : r.verdict ? "issue" : "";
        return `<button class="task ${index === selected ? "active" : ""}" data-index="${index}"><div class="task-top"><span class="dot ${state}"></span><span class="task-id">${escapeHtml(task.audit_id)}</span></div><div class="task-type">${escapeHtml(prettyType(task.audit_type))}</div></button>`;
      }).join("") : '<div class="empty">No tasks match this view.</div>';
      document.querySelectorAll(".task").forEach(button => button.addEventListener("click", () => { selected = Number(button.dataset.index); render(); }));
    }
    function meta(task) {
      const items = [["Source", task.source_id], ["Locator", task.locator], ["Filing date", task.filing_date], ["Accepted at", task.accepted_at], ["Accession", task.accession], ["SHA-256", task.source_sha256]];
      return `<div class="meta">${items.filter(([,v]) => v).map(([k,v]) => `<div class="meta-item"><span>${k}</span><div>${escapeHtml(v)}</div></div>`).join("")}</div>`;
    }
    function taskMaterial(task) {
      if (task.audit_type === "source") {
        const link = /^https:\/\/www\.sec\.gov\//.test(task.url) ? `<p><a href="${escapeHtml(task.url)}" target="_blank" rel="noopener noreferrer">Open locked SEC source ↗</a></p>` : "";
        return `<section class="card"><h3>Locked source metadata</h3>${meta(task)}${link}</section><section class="card"><h3>Claimed excerpt</h3><blockquote>${escapeHtml(task.claimed_excerpt)}</blockquote></section>`;
      }
      if (task.audit_type === "oracle_calculation") {
        const facts = parseJson(task.input_facts, []);
        return `<section class="card"><h3>Input facts</h3>${facts.map(f => `<div class="record"><strong>${escapeHtml(f.fact_id)}</strong><p>${escapeHtml(f.value)} ${escapeHtml(f.unit)} · ${escapeHtml(f.basis)}</p></div>`).join("")}<h3 style="margin-top:18px">Calculation specification</h3><pre>${escapeHtml(JSON.stringify(parseJson(task.calculation_spec, {}), null, 2))}</pre></section>`;
      }
      const records = parseJson(task.record_previews, []);
      return `<section class="card"><h3>Candidate equivalent records</h3>${records.map(record => `<div class="record"><strong>${escapeHtml(record.record_id)}</strong><div class="mono">${escapeHtml(record.source_id)} · ${escapeHtml(record.locator)}${record.accepted_at ? ` · ${escapeHtml(record.accepted_at)}` : ""}</div><p>${escapeHtml(record.text_preview)}</p></div>`).join("")}</section>`;
    }
    function renderDetail() {
      const task = TASKS[selected]; const r = response(task);
      $("content").innerHTML = `<div class="eyebrow">${escapeHtml(prettyType(task.audit_type))} · ${selected + 1} of ${TASKS.length}</div><h2>${escapeHtml(task.audit_id)}</h2><div class="subtitle">${escapeHtml(task.review_task)}</div><div class="notice"><strong>Blind review</strong><span>Expected results remain hidden. Record your independent result before assigning a verdict.</span></div>${taskMaterial(task)}<section class="card"><h3>Review guidance</h3><p>${escapeHtml(task.review_guidance)}</p></section><section class="card"><div class="form-title"><h3>Your review</h3><span class="saved" id="saved">Stored only in this browser</span></div><div class="verdicts">${["PASS","FAIL","NOT_ASSESSABLE"].map(v => `<button class="verdict ${r.verdict === v ? "selected" : ""}" data-value="${v}">${v.replace("_", " ")}</button>`).join("")}</div><label for="independent-result">Independent result <small>required for completion</small></label><textarea id="independent-result" placeholder="Transcribe the verified fact, show the arithmetic, or record VALID / suspect record IDs…">${escapeHtml(r.independent_result)}</textarea><label for="notes">Notes <small>required context for non-PASS verdicts</small></label><textarea id="notes" placeholder="Concise rationale, ambiguity, or follow-up needed…">${escapeHtml(r.notes)}</textarea></section><div class="nav"><div class="nav-group"><button class="secondary" id="previous" ${selected === 0 ? "disabled" : ""}>← Previous</button><button class="secondary" id="next" ${selected === TASKS.length - 1 ? "disabled" : ""}>Next →</button></div><button class="secondary" id="next-pending">Next pending</button></div><div class="footer-tools"><span>Reviewer ${reviewer.toUpperCase()} · ${TASKS.length} frozen tasks</span><div><button class="secondary" id="import">Import CSV</button> <button class="secondary danger" id="reset">Reset reviewer</button></div></div>`;
      document.querySelectorAll(".verdict").forEach(button => button.addEventListener("click", () => update({verdict: button.dataset.value})));
      $("independent-result").addEventListener("input", event => update({independent_result: event.target.value}, false));
      $("notes").addEventListener("input", event => update({notes: event.target.value}, false));
      $("previous").addEventListener("click", () => move(-1));
      $("next").addEventListener("click", () => move(1));
      $("next-pending").addEventListener("click", nextPending);
      $("import").addEventListener("click", () => $("import-file").click());
      $("reset").addEventListener("click", resetReviewer);
    }
    function update(values, rerender = true) {
      const task = TASKS[selected]; responses[task.audit_id] = {...response(task), ...values}; saveResponses();
      if (rerender) renderDetail();
    }
    function move(delta) { selected = Math.max(0, Math.min(TASKS.length - 1, selected + delta)); render(); }
    function nextPending() {
      for (let step = 1; step <= TASKS.length; step++) { const index = (selected + step) % TASKS.length; if (!complete(TASKS[index])) { selected = index; render(); return; } }
      alert("All tasks are complete for this reviewer.");
    }
    function csvEscape(value) { const text = String(value ?? ""); return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text; }
    function exportCsv() {
      const rows = [FIELDS.join(","), ...TASKS.map(task => FIELDS.map(field => csvEscape(field in task ? task[field] : response(task)[field])).join(","))];
      const blob = new Blob(["\ufeff" + rows.join("\n") + "\n"], {type:"text/csv;charset=utf-8"});
      const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `reviewer-${reviewer}.csv`; link.click(); URL.revokeObjectURL(link.href);
    }
    function parseCsv(text) {
      const rows = []; let row = []; let cell = ""; let quoted = false;
      for (let i = 0; i < text.length; i++) { const ch = text[i]; if (quoted) { if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; } else if (ch === '"') quoted = false; else cell += ch; } else if (ch === '"') quoted = true; else if (ch === ',') { row.push(cell); cell = ""; } else if (ch === '\n') { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; } else cell += ch; }
      if (cell || row.length) { row.push(cell.replace(/\r$/, "")); rows.push(row); }
      const header = rows.shift() || []; return rows.filter(r => r.some(Boolean)).map(r => Object.fromEntries(header.map((h,i) => [h.replace(/^\ufeff/, ""), r[i] || ""])));
    }
    function importCsv(file) {
      const reader = new FileReader(); reader.onload = () => { try { const rows = parseCsv(reader.result); const ids = new Set(TASKS.map(t => t.audit_id)); if (rows.length !== TASKS.length || rows.some(r => !ids.has(r.audit_id))) throw new Error("CSV does not cover the frozen 98-task set."); responses = Object.fromEntries(rows.map(r => [r.audit_id, {verdict:r.verdict || "", independent_result:r.independent_result || "", notes:r.notes || ""}])); saveResponses(); render(); alert(`Imported ${rows.length} rows for Reviewer ${reviewer.toUpperCase()}.`); } catch (error) { alert(`Import failed: ${error.message}`); } }; reader.readAsText(file); }
    function resetReviewer() { if (confirm(`Clear all locally stored answers for Reviewer ${reviewer.toUpperCase()}?`)) { responses = {}; localStorage.removeItem(key(reviewer)); render(); } }
    function render() { renderStats(); renderList(); renderDetail(); }
    $("reviewer").value = reviewer;
    $("reviewer").addEventListener("change", event => { reviewer = event.target.value; localStorage.setItem("fastclaw-stage2-reviewer", reviewer); responses = loadResponses(reviewer); render(); });
    $("search").addEventListener("input", event => { query = event.target.value; renderList(); });
    $("filters").addEventListener("click", event => { if (!event.target.dataset.filter) return; filter = event.target.dataset.filter; document.querySelectorAll(".filter").forEach(b => b.classList.toggle("active", b === event.target)); renderList(); });
    $("export").addEventListener("click", exportCsv);
    $("import-file").addEventListener("change", event => { if (event.target.files[0]) importCsv(event.target.files[0]); event.target.value = ""; });
    document.addEventListener("keydown", event => { if (event.target.matches("textarea,input,select")) return; if (event.key === "ArrowLeft") move(-1); if (event.key === "ArrowRight") move(1); });
    render();
  </script>
</body>
</html>
